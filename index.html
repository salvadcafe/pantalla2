<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SALVAD CAFÉ</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#000;
}

.slide{
    position:fixed;
    inset:0;
    background:#000;
    opacity:0;
    visibility:hidden;
    transition:opacity 0.8s ease;
}

.slide.active{
    opacity:1;
    visibility:visible;
}

video,
img{
    position:absolute;
    top:50%;
    left:50%;

    transform:
        translate(-50%, -50%)
        rotate(90deg);

    width:100vh;
    height:100vw;

    object-fit:cover;
}

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.05);
    pointer-events:none;
}

</style>
</head>

<body>

<div id="videoSlide" class="slide active">

    <video
        id="promoVideo"
        autoplay
        muted
        playsinline
        webkit-playsinline>

        <source src="video.mp4" type="video/mp4">

    </video>

    <div class="overlay"></div>

</div>
